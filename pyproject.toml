[project]
name = "chameleon-data"
version = "0.3.1"
description = "Interactive CLI to mask columns of CSV/TSV/XLSX files with Faker-generated fake data"
readme = "README.md"
authors = [
    { name = "hidariutiwa", email = "hidariutiwa22@gmail.com" }
]
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["cli", "faker", "masking", "anonymize", "csv", "excel"]
classifiers = [
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = [
    "faker>=40.43.0",
    "openpyxl>=3.1.5",
    "pandas>=3.1.0",
    "pydantic>=2.14.1",
    "questionary>=2.1.1",
    "rich>=15.0.0",
]

[project.urls]
Repository = "https://github.com/hidariutiwa/chameleon-data"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
chameleon = "chameleon_data.main:main"
chameleon-example = "chameleon_data.main:create_example"
